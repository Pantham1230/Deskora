databases:
  - name: deskora-db
    plan: starter
    postgresMajorVersion: "17"

services:
  - type: web
    name: deskora-api
    runtime: node
    plan: starter
    rootDir: apps/server
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: deskora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CANCELLATION_WINDOW_HOURS
        value: 3
      - key: DEMO_SIMULATION
        value: off

  - type: web
    name: deskora-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://deskora-api.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://deskora-api.onrender.com